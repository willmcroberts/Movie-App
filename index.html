<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cinzel+Decorative:wght@400;700;900&family=Inder&family=Monofett&family=Rubik+Storm&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <title>Movie Meeter</title>
</head>
<body>
    <div id="container">
        <h1>Movie Meeter</h1>
        <p>Welcome! Movie Meeter is your ultimate destination for discovering and exploring the latest movies. Just click the button below to load 20 of the currently most talked about films.</p>
        <button id="load-movies" type="button">Load Movies</button>
    </div>
    <div id="movie-container">
    </div>
    <footer aria-label="Data attribution">
        <p>All data provided by TMDB.</p>
        <img src="https://www.themoviedb.org/assets/v4/logos/v2/blue_square_1-5bdc75aaebeb75dc7ae79426ddd9be3b2be1e342510f8202baf6bffa71d7f5c4.svg" alt="TMDB logo">
    </footer>
</body>
</html>
